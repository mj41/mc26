# The whole chain for one Minecraft version, without publishing anything:
# extract → build → vet/test → smoke and the example bots against a vanilla
# server in a container. Runs on every pull request for the newest supported
# version and on demand for any version.
name: pipeline
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Minecraft version id (26.1 or later)
        required: true
        default: "26.2"
  workflow_call:
    inputs:
      version:
        type: string
        required: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || '26.2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: examples of this version
        uses: actions/checkout@v4
        with:
          repository: mj41/go-mc26-examples
          path: temp/examples
      - name: cache server jars
        uses: actions/cache@v4
        with:
          path: temp/cache
          key: server-jar-${{ env.VERSION }}
      - name: extract, build, test, smoke, example bots
        run: go run ./gen/cmd/mc26 pipeline --version "$VERSION" --smoke --e2e --examples temp/examples
      - name: packet schema coverage
        run: go run ./gen/cmd/schemacov "$VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc26-${{ env.VERSION }}
          path: |
            temp/data/${{ env.VERSION }}/*.json
            temp/lib/${{ env.VERSION }}
            temp/smoke/${{ env.VERSION }}/server.log
            temp/e2e/${{ env.VERSION }}/server/server.log
          retention-days: 7
